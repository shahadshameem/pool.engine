# ==============================================================================
# WayMate Monorepo — Local Development Deployment Stack
# Coordinates Frontend (React Vite), Backend (Pool Engine API), PostgreSQL, and OSRM.
# ==============================================================================

version: "3.8"

services:
  # ---------------------------------------------------------------------------
  # Database: PostgreSQL 16
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: pool-engine-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pool_engine
      POSTGRES_USER: pool_user
      POSTGRES_PASSWORD: pool_development_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../backend/src/engine/adapters/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pool_user -d pool_engine"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # Routing Engine: OSRM Backend (Optional road-network routing)
  # ---------------------------------------------------------------------------
  osrm:
    image: osrm/osrm-backend:v5.27.1
    container_name: pool-engine-osrm
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./osrm-data:/data
    command: osrm-routed --algorithm ch /data/region.osrm

  # ---------------------------------------------------------------------------
  # Core Service: Pool Engine ASGI API
  # ---------------------------------------------------------------------------
  pool-engine:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: pool-engine-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      SERVICE_HOST: "0.0.0.0"
      SERVICE_PORT: "8000"
      DATABASE_URL: "postgresql://pool_user:pool_development_password@postgres:5432/pool_engine"
      OSRM_BASE_URL: "${OSRM_BASE_URL:-}"
      ROUTING_TIMEOUT_SECONDS: "0.45"
      AUTH_ENABLED: "false"
      MAX_BATCH_SIZE: "500"
      DEFAULT_DISPATCH_TIMEOUT_SECONDS: "0.500"
      SHUTDOWN_TIMEOUT_SECONDS: "10.0"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173"
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Frontend Web App: WayMate React SPA
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        VITE_POOL_ENGINE_URL: "http://localhost:8000"
        VITE_USE_POOL_ENGINE: "true"
    container_name: waymate-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - pool-engine

volumes:
  pgdata:
