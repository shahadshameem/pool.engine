# ==============================================================================
# Nginx Reverse Proxy Configuration for WayMate Pool Engine
# Location: /etc/nginx/sites-available/pool-engine.conf
# ==============================================================================

# Rate limiting zone: 30 requests/second per IP with 10MB state storage
limit_req_zone $binary_remote_addr zone=pool_engine_api_limit:10m rate=30r/s;
limit_req_status 429;

# Upstream Pool Engine ASGI service (local loopback port 8000)
upstream pool_engine_backend {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api-pool.waymate.in;

    # Certbot challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Secure HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api-pool.waymate.in;

    # TLS Certificates (Managed by Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/api-pool.waymate.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-pool.waymate.in/privkey.pem;

    # Modern TLS Security Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Max Request Body Size (Pool Engine API payloads capped at 1MB to prevent DoS)
    client_max_body_size 1M;

    # Public Health Check Endpoints (Bypass rate limiting for monitoring probes)
    location ~ ^/v1/health/(liveness|readiness)$ {
        proxy_pass http://pool_engine_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    # API Endpoints (Protected by Rate Limiting and Strict Timeouts)
    location /v1/ {
        limit_req zone=pool_engine_api_limit burst=20 nodelay;

        proxy_pass http://pool_engine_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Internal Timeouts (OSRM road routing + DARP batch dispatch)
        proxy_connect_timeout 3s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    # Deny all other paths
    location / {
        return 404 '{"error": {"code": "NOT_FOUND", "message": "Resource not found"}}';
        default_type application/json;
    }
}
