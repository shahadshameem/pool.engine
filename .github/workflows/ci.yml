name: CI & Linux Deployment Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-verify:
    name: Test, Lint & Database Verification (Ubuntu Linux)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pool_test
          POSTGRES_USER: pool_user
          POSTGRES_PASSWORD: pool_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres,service]"

      - name: Check Git line endings and whitespace
        run: |
          git diff --check

      - name: Strict Mypy type check
        run: |
          python -m mypy src tests scripts

      - name: Run Pytest suite with live PostgreSQL
        env:
          TEST_DATABASE_URL: "postgresql://pool_user:pool_test_password@127.0.0.1:5432/pool_test"
        run: |
          pytest -v tests --tb=short -ra

      - name: Verify PostgreSQL schema initialization idempotency
        env:
          TEST_DB_URL: "postgresql://pool_user:pool_test_password@127.0.0.1:5432/pool_test"
        run: |
          echo "=== 1. Initial schema application ==="
          python scripts/init_db.py --dsn "$TEST_DB_URL"
          echo "=== 2. Re-apply schema to prove idempotency ==="
          python scripts/init_db.py --dsn "$TEST_DB_URL"
          echo "=== 3. Schema check-only verification ==="
          python scripts/init_db.py --dsn "$TEST_DB_URL" --check-only

      - name: Run in-process API smoke test
        run: |
          python scripts/smoke_test.py --base-url in-process

      - name: Validate Systemd service unit syntax
        run: |
          sudo useradd -r -s /sbin/nologin poolengine || true
          sudo systemd-analyze verify deploy/systemd/pool-engine.service || true

  docker-and-deployment:
    name: Docker Build, Compose Healthcheck & Graceful Shutdown
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose configuration
        run: |
          mkdir -p deploy/docker/osrm-data
          docker compose -f deploy/docker/docker-compose.yml config

      - name: Build Docker image directly
        run: |
          docker build -t pool-engine:ci -f deploy/docker/Dockerfile .

      - name: Launch Docker Compose stack (PostgreSQL and Pool Engine)
        run: |
          docker compose -f deploy/docker/docker-compose.yml up -d --build postgres pool-engine

          # Wait for API container health
          for i in {1..30}; do
            if curl -s -f http://127.0.0.1:8000/v1/health/liveness; then
              echo "Pool Engine container is healthy and responding!"
              break
            fi
            sleep 1
          done

      - name: Initialize database schema via container exec
        run: |
          docker compose -f deploy/docker/docker-compose.yml exec -T pool-engine python /app/scripts/init_db.py

      - name: Run smoke test against running container
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[service,postgres]"
          python scripts/smoke_test.py --base-url http://127.0.0.1:8000

      - name: Test graceful container shutdown under SIGTERM
        run: |
          echo "Sending SIGTERM to pool-engine-api container via Compose..."
          STOP_START=$(date +%s%N)
          docker compose -f deploy/docker/docker-compose.yml stop -t 15 pool-engine
          STOP_END=$(date +%s%N)
          DURATION_MS=$(( (STOP_END - STOP_START) / 1000000 ))
          echo "Graceful shutdown completed in ${DURATION_MS}ms"

          # Verify exit status
          EXIT_CODE=$(docker inspect --format='{{.State.ExitCode}}' pool-engine-api)
          echo "Container exit code: ${EXIT_CODE}"
          if [ "$EXIT_CODE" -ne 0 ] && [ "$EXIT_CODE" -ne 143 ]; then
            echo "Unexpected exit code: ${EXIT_CODE}"
            exit 1
          fi

          docker compose -f deploy/docker/docker-compose.yml down -v
